# cargo-deny 設定 — 同梱クレートのライセンスを検査し、GPL/AGPL 等の
# 強コピーレフト混入を CI で検知する。許可リストに無いライセンスはエラー。
#   ローカル実行: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check licenses
#   CI: .github/workflows/ci.yml の "License check (cargo-deny)" ジョブ

[licenses]
# 現行の依存ツリーに実在する寛容ライセンス＋弱コピーレフト(MPL-2.0)のみを許可。
# ここに無いライセンス（GPL/AGPL/LGPL 単独 等）が混入すると検査が失敗する。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MIT-0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",            # 弱コピーレフト（ファイル単位）。未改変利用のため自社コード公開は不要
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# 自社の未公開クレート（publish = false）はライセンス検査の対象外にする。
private = { ignore = true }

# 注: libgit2（GPLv2＋リンク例外）は libgit2-sys が vendored する C ライブラリで、
# クレートの license フィールドは MIT/Apache のため cargo-deny は検知しない。
# これは docs/development/oss-license-audit.md に整理済みで、THIRD-PARTY-NOTICES で表記する。

[bans]
# ライセンス検査が主目的のため重複バージョンは許容（check licenses では未評価）。
multiple-versions = "allow"

[sources]
unknown-registry = "allow"
unknown-git = "allow"
