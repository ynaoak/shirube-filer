# cargo-about 設定 — 同梱 Rust クレートのライセンス全文を収集して
# THIRD-PARTY-NOTICES-rust.md を生成する。
#   生成: make notices （または下記を直接実行）
#   cargo about generate -c about.toml about.hbs -o ../THIRD-PARTY-NOTICES-rust.md

# 出荷バイナリに含まれない build/dev 依存は表記対象から除外する。
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 自社の未公開クレートは対象外。
private = { ignore = true }

# 許可ライセンス（deny.toml の allow と同一方針）。
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MIT-0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
